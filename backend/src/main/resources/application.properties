server.port=8080

# Spring Application Name
spring.application.name=instantconnect-backend

# Database Configuration (H2 in MySQL Compatibility Mode for zero-config startup)
spring.datasource.url=jdbc:h2:mem:instantconnect_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 console for debugging fallback
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
